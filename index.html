<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julieta & Cadmiel — Descubra a sua mesa</title>

<style>
:root {
    --vinho: #74131a;
    --vinho-escuro: #570d13;
    --dourado: #c79a52;
    --creme: #fffaf4;
    --texto: #382d27;
    --borda: #ead7c2;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--texto);

    background:
        radial-gradient(circle at 10% 20%,
        rgba(199,154,82,.10),
        transparent 25%),

        radial-gradient(circle at 90% 20%,
        rgba(199,154,82,.10),
        transparent 25%),

        linear-gradient(
        135deg,
        #fffdf9,
        #f8efe5
        );
}

.container {
    width: min(760px, calc(100% - 28px));
    margin: auto;
    padding: 25px 0 50px;
}

/* CABEÇALHO */

.header {
    text-align: center;
    padding: 10px 10px 20px;
}

.monograma {
    font-family: Georgia, serif;
    font-size: 50px;
    font-style: italic;
    color: #a97838;
}

.nomes {
    font-family: Georgia, serif;
    color: var(--vinho);
    font-size: clamp(35px, 7vw, 58px);
    margin: 5px 0;
    letter-spacing: 2px;
}

.separador {
    color: var(--dourado);
    margin: 12px;
    font-size: 20px;
}

.header h2 {
    font-family: Georgia, serif;
    color: var(--vinho);
    font-size: clamp(29px, 5vw, 43px);
    margin: 10px 0;
}

.header p {
    line-height: 1.6;
    margin: auto;
    max-width: 650px;
}

/* CARTÃO */

.card {
    background: rgba(255,253,250,.98);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 22px;

    box-shadow:
        0 15px 40px
        rgba(80,50,30,.10);
}

label {
    display: block;
    font-weight: bold;
    margin: 5px 0 8px;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 16px;

    border: 1px solid #d7c5b6;
    border-radius: 10px;

    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: var(--dourado);

    box-shadow:
        0 0 0 3px
        rgba(199,154,82,.12);
}

button {
    width: 100%;
    border: none;

    padding: 15px;

    border-radius: 10px;

    background:
        linear-gradient(
        90deg,
        var(--vinho),
        var(--vinho-escuro)
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: .65;
}

.privacidade {
    text-align: center;
    font-size: 13px;
    margin-top: 12px;
    color: #6d625b;
}

/* RESULTADO */

#resultado {
    margin-top: 20px;
}

.resultado-card {
    background: #fffdfa;

    border:
        1px solid var(--borda);

    border-radius: 20px;

    padding: 28px 20px;

    text-align: center;

    box-shadow:
        0 15px 40px
        rgba(80,50,30,.10);
}

.saudacao {
    font-family: Georgia, serif;

    color: var(--vinho);

    font-size:
        clamp(27px,5vw,39px);

    font-weight: bold;

    margin-bottom: 12px;
}

.mensagem-noivos {
    font-size: 17px;
    margin-bottom: 18px;
}

.mesa-box {
    display: inline-block;

    min-width: 260px;

    background: #fff8ee;

    border:
        2px solid
        #d7ad69;

    border-radius: 14px;

    padding:
        15px 28px;
}

.mesa {
    font-family: Georgia, serif;

    color: var(--vinho);

    font-size:
        clamp(38px,7vw,57px);

    font-weight: bold;
}

.categoria {
    font-size: 17px;
    margin-top: 4px;
}

.carinho {
    margin-top: 18px;
}

.aviso {
    padding: 14px;

    border-radius: 11px;

    background: #f7eee5;

    border:
        1px solid #ead9ca;

    line-height: 1.5;
}

.erro {
    background: #fff0ef;

    border-color: #efcecb;

    color: #8d3835;
}

.footer {
    text-align: center;

    margin-top: 25px;

    font-size: 13px;

    color: #8e7d72;
}

@media(max-width:500px) {

    .container {
        width: calc(100% - 20px);
    }

    .card {
        padding: 18px;
    }

    .mesa-box {
        min-width: 220px;
    }
}
</style>
</head>


<body>

<div class="container">

    <header class="header">

        <div class="monograma">
            J & C
        </div>

        <h1 class="nomes">
            JULIETA & CADMIEL
        </h1>

        <div class="separador">
            ───── ♥ ─────
        </div>

        <h2>
            Descubra a sua mesa
        </h2>

        <p>
            Digite o seu nome completo e
            número de WhatsApp ou telefone.

            Depois clique em
            <strong>
                “Procurar a minha mesa”
            </strong>.
        </p>

    </header>


    <div class="card">

        <label for="nome">
            Digite o seu nome completo
        </label>

        <input
            id="nome"
            type="text"
            autocomplete="name"
            placeholder="Ex.: João da Silva"
        >


        <label for="telefone">
            Número de WhatsApp / telefone
        </label>

        <input
            id="telefone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="Ex.: +258 86 000 0000"
        >


        <button
            id="botao"
            type="button"
            onclick="procurarMesa()"
        >
            🔎 Procurar a minha mesa
        </button>


        <div class="privacidade">

            🔒 Os seus dados são usados
            apenas para localizar a sua mesa.

        </div>

    </div>


    <div id="resultado"></div>


    <div class="footer">

        Com carinho,
        Julieta & Cadmiel ❤️

    </div>

</div>



<script>

/*
================================================
CONFIGURAÇÃO DO SUPABASE
================================================
*/

var SUPABASE_URL =
"https://dzvscfeypjoytajqxczs.supabase.co";

var SUPABASE_KEY =
"sb_publishable_Gxfls-Yl2krdF-4Xzbc_4A_XvRv0iNK";


var LISTA_ID = null;


/*
================================================
FUNÇÕES AUXILIARES
================================================
*/

function elemento(id) {

    return document.getElementById(id);

}


function escapar(texto) {

    if (texto === null ||
        texto === undefined) {

        return "";

    }

    return String(texto)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


function mostrarMensagem(
    mensagem,
    erro
) {

    var classe =
        erro
        ? "aviso erro"
        : "aviso";


    elemento("resultado").innerHTML =

        '<div class="' +
        classe +
        '">' +

        escapar(mensagem) +

        '</div>';

}


/*
================================================
COMUNICAÇÃO COM SUPABASE
================================================
*/

function requisicao(
    metodo,
    endereco,
    dados,
    sucesso,
    falha
) {

    var xhr =
        new XMLHttpRequest();


    xhr.open(
        metodo,
        endereco,
        true
    );


    xhr.setRequestHeader(
        "apikey",
        SUPABASE_KEY
    );


    xhr.setRequestHeader(
        "Content-Type",
        "application/json"
    );


    xhr.onreadystatechange =
    function () {

        if (
            xhr.readyState !== 4
        ) {

            return;

        }


        if (
            xhr.status >= 200 &&
            xhr.status < 300
        ) {

            var resposta = null;


            try {

                resposta =
                    xhr.responseText
                    ? JSON.parse(
                        xhr.responseText
                    )
                    : null;

            }

            catch (erro) {

                resposta = null;

            }


            sucesso(resposta);

        }

        else {

            falha(
                xhr.status,
                xhr.responseText
            );

        }

    };


    xhr.onerror =
    function () {

        falha(
            0,
            "Erro de rede"
        );

    };


    if (dados) {

        xhr.send(
            JSON.stringify(dados)
        );

    }

    else {

        xhr.send();

    }

}


/*
================================================
CARREGAR LISTA ATIVA
================================================
*/

function carregarLista() {

    var endereco =

        SUPABASE_URL +

        "/rest/v1/listas" +

        "?select=id,nome,slug,ativo" +

        "&ativo=eq.true" +

        "&order=id.asc";


    requisicao(

        "GET",

        endereco,

        null,


        function (dados) {

            if (
                dados &&
                dados.length > 0
            ) {

                LISTA_ID =
                    dados[0].id;

                console.log(
                    "Lista carregada:",
                    LISTA_ID
                );

            }

            else {

                mostrarMensagem(

                    "A lista do casamento não está disponível.",

                    true

                );

            }

        },


        function () {

            mostrarMensagem(

                "Não foi possível carregar a lista. Verifique a internet e atualize a página.",

                true

            );

        }

    );

}


/*
================================================
PROCURAR CONVIDADO
================================================
*/

function procurarMesa() {

    var nome =
        elemento("nome")
        .value
        .trim();


    var telefone =
        elemento("telefone")
        .value
        .trim();


    var botao =
        elemento("botao");


    /*
    Nome obrigatório
    */

    if (
        nome.length < 3
    ) {

        mostrarMensagem(

            "Por favor, escreva o seu nome completo.",

            false

        );

        return;

    }


    /*
    Lista ainda não carregou
    */

    if (!LISTA_ID) {

        mostrarMensagem(

            "A lista ainda está a carregar. Aguarde alguns segundos e tente novamente.",

            false

        );


        carregarLista();

        return;

    }


    /*
    Estado de procura
    */

    botao.disabled = true;

    botao.innerHTML =
        "A procurar o seu nome...";


    mostrarMensagem(

        "A procurar o seu nome...",

        false

    );


    var endereco =

        SUPABASE_URL +

        "/rest/v1/rpc/buscar_convidado";


    var parametros = {

        p_lista_id:
            LISTA_ID,

        p_nome:
            nome,

        p_telefone:
            telefone || null

    };


    requisicao(

        "POST",

        endereco,

        parametros,


        /*
        SUCESSO
        */

        function (dados) {

            botao.disabled = false;

            botao.innerHTML =
                "🔎 Procurar a minha mesa";


            /*
            Nomes repetidos
            */

            if (
                dados &&
                dados.length > 0 &&
                dados[0].requer_telefone
            ) {

                mostrarMensagem(

                    "Existem convidados com o mesmo nome. Confirme o seu número de telefone e tente novamente.",

                    false

                );

                return;

            }


            /*
            Não encontrado
            */

            if (
                !dados ||
                dados.length === 0
            ) {

                mostrarMensagem(

                    "Não conseguimos encontrar este nome na lista. Confirme se escreveu o seu nome completo corretamente.",

                    false

                );

                return;

            }


            /*
            CONVIDADO ENCONTRADO
            */

            var convidado =
                dados[0];


            elemento(
                "resultado"
            ).innerHTML =

                '<div class="resultado-card">' +

                    '<div class="saudacao">' +

                        'Olá, ' +

                        escapar(
                            convidado.nome
                        ) +

                        '! 👋' +

                    '</div>' +


                    '<div class="mensagem-noivos">' +

                        'Os noivos ' +

                        '<strong>' +

                        'Julieta & Cadmiel' +

                        '</strong>' +

                        ' informam a sua mesa:' +

                    '</div>' +


                    '<div class="mesa-box">' +

                        '<div class="mesa">' +

                            escapar(
                                convidado.mesa_nome
                            ) +

                        '</div>' +


                        '<div class="categoria">' +

                            escapar(
                                convidado.categoria
                                || ""
                            ) +

                        '</div>' +

                    '</div>' +


                    '<div class="carinho">' +

                        'Será um prazer celebrar este momento consigo. ❤️' +

                    '</div>' +

                '</div>';

        },


        /*
        ERRO
        */

        function (
            status,
            detalhe
        ) {

            console.log(
                "Erro Supabase:",
                status,
                detalhe
            );


            botao.disabled = false;

            botao.innerHTML =
                "🔎 Procurar a minha mesa";


            mostrarMensagem(

                "Não foi possível concluir a pesquisa. Atualize a página e tente novamente.",

                true

            );

        }

    );

}


/*
================================================
ENTER TAMBÉM PESQUISA
================================================
*/

elemento("nome")
.addEventListener(
    "keydown",
    function (evento) {

        if (
            evento.key === "Enter"
        ) {

            procurarMesa();

        }

    }
);


elemento("telefone")
.addEventListener(
    "keydown",
    function (evento) {

        if (
            evento.key === "Enter"
        ) {

            procurarMesa();

        }

    }
);


/*
================================================
INICIAR
================================================
*/

carregarLista();

</script>

</body>
</html>
