<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Julieta & Cadmiel — Encontre a sua mesa</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#fbf6f0;--card:#fff;--ink:#382a25;--muted:#7d6d65;--gold:#9a6848;--line:#ead9cc;--soft:#fff8f2;--danger:#a94442}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffaf5,#f5ebe1);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1050px;margin:auto;padding:22px 14px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 35px #68482a12;padding:24px}.hero{text-align:center;max-width:650px;margin:35px auto}.hero h1{font:38px Georgia,serif;color:#744b35;margin:8px 0}.hero p{color:var(--muted)}.divider{height:2px;width:75px;background:#c69c78;margin:22px auto}label{display:block;font-weight:700;margin:10px 0 6px}input,select{width:100%;padding:13px 14px;border:1px solid #d9c5b6;border-radius:12px;background:#fff;outline:none}.btn{padding:12px 16px;border-radius:11px;background:var(--gold);color:#fff;font-weight:700}.btn.secondary{background:#eee2d9;color:#5d4436}.btn.danger{background:var(--danger)}.btn.small{padding:8px 10px;font-size:13px}.result{margin-top:20px}.resultbox{background:var(--soft);border:1px solid var(--line);border-radius:17px;padding:20px;text-align:center}.guest{font-size:23px;font-weight:700}.mesa{display:inline-block;margin:13px 0 5px;padding:10px 22px;border-radius:30px;background:#895c3c;color:#fff;font-size:20px;font-weight:700}.cat{color:var(--muted)}.topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.topbar h2{margin:0;font:27px Georgia,serif;color:#744b35}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px 14px;border-radius:10px;background:#eee2d9;color:#5d4436;font-weight:700}.tab.active{background:var(--gold);color:#fff}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.row-main{min-width:0}.row-main strong{display:block}.row-main span{font-size:13px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;border-radius:20px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#f6eee8;color:#684b3a;margin:12px 0}.error{background:#fff0ef;color:#8d3835}.success{background:#edf8ef;color:#34613d}.footer{text-align:center;color:#9a8980;font-size:13px;margin-top:22px}@media(max-width:700px){.hero h1{font-size:32px}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style></head><body><div class="wrap">
<section id="publicView"><div class="card hero"><div style="font-size:42px">💍</div><h1 id="publicTitle">Julieta & Cadmiel</h1><p id="publicDesc">Encontre a sua mesa</p><div class="divider"></div><label>Nome do convidado</label><input id="nomeBusca" placeholder="Digite o seu nome..."><div id="phoneArea" class="hidden"><label>WhatsApp / telefone</label><input id="telefoneBusca" placeholder="Ex.: +258 84..."></div><p style="font-size:14px">Se houver nomes iguais, informe o WhatsApp para identificar a pessoa certa.</p><div id="publicResult" class="result"></div><button class="btn secondary" onclick="showAdminLogin()">🔐 Administrador</button><div class="footer">Com carinho, Julieta & Cadmiel ❤️</div></div></section>
<section id="adminView" class="hidden"><div class="card"><div class="topbar"><h2>⚙️ Painel ADMINISTRADOR</h2><button class="btn secondary" onclick="logout()">Sair</button></div><div id="adminMsg"></div><div class="tabs"><button class="tab active" data-tab="listsTab">📋 Listas</button><button class="tab" data-tab="tablesTab">🪑 Mesas</button><button class="tab" data-tab="guestsTab">👥 Convidados</button></div><div id="listsTab"><div class="topbar"><h3>Listas</h3><button class="btn" onclick="openList()">+ Nova lista</button></div><div id="listsList" class="list"></div></div><div id="tablesTab" class="hidden"><div class="topbar"><h3>Mesas</h3><button class="btn" onclick="openTable()">+ Nova mesa</button></div><label>Lista</label><select id="tableList"></select><div id="tablesList" class="list" style="margin-top:12px"></div></div><div id="guestsTab" class="hidden"><div class="topbar"><h3>Convidados</h3><button class="btn" onclick="openGuest()">+ Novo convidado</button></div><label>Lista</label><select id="guestList"></select><input id="filter" placeholder="Pesquisar nome ou WhatsApp..." style="margin:10px 0"><div id="guestsList" class="list"></div></div></div></section></div>
<div id="auth" class="modal"><div class="modalbox"><h3>🔐 Administrador</h3><label>Email</label><input id="email" type="email" value="acadmiel21@gmail.com"><label>Senha</label><input id="password" type="password"><div id="authMsg"></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="login()">Entrar</button><button class="btn secondary" onclick="bootstrap()">Criar primeiro acesso</button><button class="btn secondary" onclick="closeM('auth')">Cancelar</button></div></div></div>
<div id="listM" class="modal"><div class="modalbox"><h3>Lista</h3><input id="lid" type="hidden"><label>Nome</label><input id="lname"><label>Descrição</label><input id="ldesc"><label>Slug</label><input id="lslug"><label><input id="lactive" type="checkbox" checked style="width:auto"> Ativa</label><div class="actions"><button class="btn" onclick="saveList()">Guardar</button><button class="btn secondary" onclick="closeM('listM')">Cancelar</button></div></div></div>
<div id="tableM" class="modal"><div class="modalbox"><h3>Mesa</h3><input id="tid" type="hidden"><label>Lista</label><select id="tlist"></select><label>Nome da mesa</label><input id="tname"><label>Categoria</label><input id="tcat"><label>Ordem</label><input id="torder" type="number" value="1"><div class="actions"><button class="btn" onclick="saveTable()">Guardar</button><button class="btn secondary" onclick="closeM('tableM')">Cancelar</button></div></div></div>
<div id="guestM" class="modal"><div class="modalbox"><h3>Convidado</h3><input id="gid" type="hidden"><label>Lista</label><select id="glist"></select><label>Nome</label><input id="gname"><label>WhatsApp / telefone</label><input id="gphone"><label>Mesa</label><select id="gtable"></select><div class="actions"><button class="btn" onclick="saveGuest()">Guardar</button><button class="btn secondary" onclick="closeM('guestM')">Cancelar</button></div></div></div>
<script>
const URL='https://dzvscfeypjoytajqxczs.supabase.co',KEY='sb_publishable_Gxfls-Yl2krdF-4Xzbc_4A_XvRv0iNK',db=supabase.createClient(URL,KEY);let lists=[],tables=[],guests=[],active=null,user=null;const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function closeM(x){$(x).classList.remove('open')}function openM(x){$(x).classList.add('open')}function notice(el,t,c='notice'){el.innerHTML=t?`<div class="notice ${c}">${esc(t)}</div>`:''}function slug(x){return x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
async function init(){const{data,error}=await db.from('listas').select('*').eq('ativo',true).order('id');if(error)return notice($('publicResult'),'Não foi possível carregar a lista.','error');lists=data||[];active=lists.find(x=>x.slug===new URLSearchParams(location.search).get('lista'))||lists[0];if(active){$('publicTitle').textContent=active.nome;$('publicDesc').textContent=active.descricao||'Encontre a sua mesa'}}
let timer;async function search(){clearTimeout(timer);timer=setTimeout(async()=>{const nome=$('nomeBusca').value.trim(),phone=$('telefoneBusca').value.trim();$('publicResult').innerHTML='';$('phoneArea').classList.add('hidden');if(nome.length<2||!active)return;const{data,error}=await db.rpc('buscar_convidado',{p_lista_id:active.id,p_nome:nome,p_telefone:phone||null});if(error)return notice($('publicResult'),'Erro ao consultar.','error');if(data?.[0]?.requer_telefone){$('phoneArea').classList.remove('hidden');return notice($('publicResult'),'Encontrámos mais de uma pessoa com esse nome. Informe o WhatsApp.')}if(!data?.length)return notice($('publicResult'),'Nome não encontrado.');$('publicResult').innerHTML=data.map(r=>`<div class="resultbox"><div class="guest">${esc(r.nome)}</div><div class="mesa">🎉 ${esc(r.mesa_nome)}</div><div class="cat">${esc(r.categoria||'')}</div></div>`).join('')},250)}$('nomeBusca').oninput=search;$('telefoneBusca').oninput=search;
function showAdminLogin(){openM('auth')}async function login(){const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return notice($('authMsg'),error.message,'error');user=data.user;await admin()}async function bootstrap(){const e=$('email').value.trim(),p=$('password').value;if(p.length<6)return notice($('authMsg'),'A senha deve ter pelo menos 6 caracteres.','error');const{data,error}=await db.auth.signUp({email:e,password:p});if(error)return notice($('authMsg'),error.message,'error');if(data.user){const{error:x}=await db.from('admin_users').insert({user_id:data.user.id,email:e});if(x)return notice($('authMsg'),'Conta criada, mas a ativação do administrador falhou.','error');user=data.user;await admin()}}async function isAdmin(){if(!user)return false;const{data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}async function admin(){if(!await isAdmin())return notice($('authMsg'),'Este usuário não é administrador.','error');closeM('auth');$('publicView').classList.add('hidden');$('adminView').classList.remove('hidden');await refresh()}async function logout(){await db.auth.signOut();user=null;$('adminView').classList.add('hidden');$('publicView').classList.remove('hidden')}
async function refresh(){const{data}=await db.from('listas').select('*').order('id');lists=data||[];active=active&&lists.find(x=>x.id===active.id)||lists[0];renderLists();fill();await loadTables();await loadGuests()}function renderLists(){$('listsList').innerHTML=lists.map(l=>`<div class="row"><div class="row-main"><strong>${esc(l.nome)}</strong><span>${esc(l.descricao||'')} · ${l.ativo?'Ativa':'Inativa'} · ${esc(l.slug||'')}</span></div><div class="actions"><button class="btn small secondary" onclick="editList(${l.id})">Editar</button><button class="btn small danger" onclick="delList(${l.id})">Remover</button></div></div>`).join('')||'<div class="notice">Nenhuma lista.</div>'}function fill(){const o=lists.map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join('');['tableList','guestList','tlist','glist'].forEach(id=>$(id).innerHTML=o);if(active){$('tableList').value=active.id;$('guestList').value=active.id;$('tlist').value=active.id;$('glist').value=active.id}$('tableList').onchange=()=>{active=lists.find(x=>x.id==$('tableList').value);loadTables()};$('guestList').onchange=()=>{active=lists.find(x=>x.id==$('guestList').value);loadGuests()};$('glist').onchange=fillGuestTables}
async function loadTables(){if(!active)return;const{data}=await db.from('mesas').select('*').eq('lista_id',active.id).order('ordem').order('id');tables=data||[];$('tablesList').innerHTML=tables.map(t=>`<div class="row"><div class="row-main"><strong>${esc(t.nome)}</strong><span>${esc(t.categoria||'')} · ordem ${t.ordem||1}</span></div><div class="actions"><button class="btn small secondary" onclick="editTable(${t.id})">Editar</button><button class="btn small danger" onclick="delTable(${t.id})">Remover</button></div></div>`).join('')||'<div class="notice">Nenhuma mesa.</div>'}async function loadGuests(){if(!active)return;const{data}=await db.from('convidados').select('id,nome,telefone,mesa_id,lista_id,mesas(nome)').eq('lista_id',active.id).order('nome');guests=data||[];renderGuests()}function renderGuests(){const f=$('filter').value.toLowerCase();$('guestsList').innerHTML=guests.filter(g=>(g.nome+' '+(g.telefone||'')).toLowerCase().includes(f)).map(g=>`<div class="row"><div class="row-main"><strong>${esc(g.nome)}</strong><span>📱 ${esc(g.telefone||'Sem WhatsApp')} · 🪑 ${esc(g.mesas?.nome||'Sem mesa')}</span></div><div class="actions"><button class="btn small secondary" onclick="editGuest(${g.id})">Editar</button><button class="btn small danger" onclick="delGuest(${g.id})">Remover</button></div></div>`).join('')||'<div class="notice">Nenhum convidado encontrado.</div>'}$('filter').oninput=renderGuests;
function openList(){$('lid').value='';$('lname').value='';$('ldesc').value='';$('lslug').value='';$('lactive').checked=true;openM('listM')}function editList(id){let l=lists.find(x=>x.id===id);$('lid').value=l.id;$('lname').value=l.nome;$('ldesc').value=l.descricao||'';$('lslug').value=l.slug||'';$('lactive').checked=l.ativo;openM('listM')}async function saveList(){let id=$('lid').value,p={nome:$('lname').value.trim(),descricao:$('ldesc').value.trim(),slug:slug($('lslug').value||$('lname').value),ativo:$('lactive').checked};let r=id?await db.from('listas').update(p).eq('id',id):await db.from('listas').insert(p);if(r.error)return alert(r.error.message);closeM('listM');refresh()}async function delList(id){if(!confirm('Remover esta lista?'))return;let r=await db.from('listas').delete().eq('id',id);if(r.error)alert(r.error.message);else refresh()}
function openTable(){$('tid').value='';$('tlist').value=active?.id||'';$('tname').value='';$('tcat').value='';$('torder').value=tables.length+1;openM('tableM')}function editTable(id){let t=tables.find(x=>x.id===id);$('tid').value=t.id;$('tlist').value=t.lista_id;$('tname').value=t.nome;$('tcat').value=t.categoria||'';$('torder').value=t.ordem||1;openM('tableM')}async function saveTable(){let id=$('tid').value,p={lista_id:+$('tlist').value,nome:$('tname').value.trim(),categoria:$('tcat').value.trim(),ordem:+$('torder').value||1};let r=id?await db.from('mesas').update(p).eq('id',id):await db.from('mesas').insert(p);if(r.error)return alert(r.error.message);closeM('tableM');refresh()}async function delTable(id){if(!confirm('Remover esta mesa?'))return;let r=await db.from('mesas').delete().eq('id',id);if(r.error)alert(r.error.message);else refresh()}
async function fillGuestTables(){const{data}=await db.from('mesas').select('*').eq('lista_id',+$('glist').value).order('ordem');tables=data||[];$('gtable').innerHTML=tables.map(t=>`<option value="${t.id}">${esc(t.nome)} — ${esc(t.categoria||'')}</option>`).join('')||'<option value="">Sem mesas</option>'}async function openGuest(){$('gid').value='';$('glist').value=active?.id||'';await fillGuestTables();$('gname').value='';$('gphone').value='';openM('guestM')}async function editGuest(id){let g=guests.find(x=>x.id===id);$('gid').value=g.id;$('glist').value=g.lista_id;await fillGuestTables();$('gtable').value=g.mesa_id;$('gname').value=g.nome;$('gphone').value=g.telefone||'';openM('guestM')}async function saveGuest(){let id=$('gid').value,p={lista_id:+$('glist').value,nome:$('gname').value.trim(),telefone:$('gphone').value.trim()||null,mesa_id:+$('gtable').value||null};if(!p.nome)return alert('Informe o nome.');let r=id?await db.from('convidados').update(p).eq('id',id):await db.from('convidados').insert(p);if(r.error)return alert(r.error.message);closeM('guestM');refresh()}async function delGuest(id){if(!confirm('Remover este convidado?'))return;let r=await db.from('convidados').delete().eq('id',id);if(r.error)alert(r.error.message);else refresh()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));['listsTab','tablesTab','guestsTab'].forEach(x=>$(x).classList.add('hidden'));b.classList.add('active');$(b.dataset.tab).classList.remove('hidden')});db.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;if(await isAdmin())admin()}});init();
</script></body></html>
