  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #fff8f0, #f8eee5);
      color: #3b2a25;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 10px 35px rgba(80, 50, 30, 0.12);
    }

    .rings {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 38px;
      color: #7b4b35;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 18px;
      color: #7b6a62;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: #c69c78;
      margin: 25px auto;
    }

    .search-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      border: 2px solid #dec9ba;
      border-radius: 14px;
      font-size: 17px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #a87554;
      box-shadow: 0 0 0 3px rgba(168, 117, 84, 0.12);
    }

    .hint {
      margin-top: 10px;
      color: #8a7770;
      font-size: 14px;
    }

    #resultado {
      margin-top: 25px;
    }

    .result-card {
      background: #fff8f2;
      border: 1px solid #ead7c8;
      border-radius: 18px;
      padding: 22px;
      animation: aparecer 0.25s ease;
    }

    .guest-name {
      font-size: 24px;
      font-weight: bold;
      color: #67402f;
      margin-bottom: 12px;
    }

    .mesa {
      display: inline-block;
      background: #8b5e3c;
      color: white;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
    }

    .categoria {
      margin-top: 12px;
      color: #7d6a60;
      font-size: 15px;
    }

    .not-found {
      color: #8b5e3c;
      font-size: 17px;
      padding: 15px;
    }

    .footer {
      margin-top: 25px;
      color: #9a8980;
      font-size: 13px;
      line-height: 1.5;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 18px;
      }

      h1 {
        font-size: 32px;
      }

      .guest-name {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

      <div id="resultado"></div>

      <div class="footer">
        Com carinho, Julieta & Cadmiel ❤️

function normalizar(texto) {
  return texto
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

const pesquisa = document.getElementById("pesquisa");
const resultado = document.getElementById("resultado");

pesquisa.addEventListener("input", function() {

  const termo = normalizar(this.value);

  if (termo.length < 2) {
    resultado.innerHTML = "";
    return;
  }

  const encontrados = convidados.filter(function(convidado) {
    return normalizar(convidado.nome).includes(termo);
  });

  if (encontrados.length === 0) {
    resultado.innerHTML = `
      <div class="not-found">
        Não encontramos esse nome. ❤️<br>
        Tente escrever novamente.
      </div>
    `;
    return;
  }

  resultado.innerHTML = encontrados.map(function(convidado) {
    return `
      <div class="result-card">
        <div class="guest-name">
          ${convidado.nome}
        </div>

        <div class="mesa">
          🎉 ${convidado.mesa}
        </div>

        <div class="categoria">
          ${convidado.categoria}
        </div>
      </div>
    `;
  }).join("");

});
