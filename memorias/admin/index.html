<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Memórias Julieta & Cadmiel</title><style>:root{--v:#74131a;--o:#c79a52;--bg:#f8efe5}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#fffdf9,var(--bg));color:#382d27}.w{width:min(1000px,calc(100% - 20px));margin:auto;padding:30px 0}h1,h2{font-family:Georgia;color:var(--v);text-align:center}.card{background:#fff;border:1px solid #ead7c2;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 10px 30px #50321e18}input,textarea,button{width:100%;padding:13px;border-radius:10px;font-size:16px;margin:6px 0}input,textarea{border:1px solid #d7c5b6}button{border:0;background:var(--v);color:white;font-weight:bold;cursor:pointer}.secondary{background:#8a7668}.danger{background:#9b2c2c}.ok{background:#446b43}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.item{background:#fff;border:1px solid #ead7c2;border-radius:14px;overflow:hidden}.item img{width:100%;height:240px;object-fit:cover}.pad{padding:12px}.pad button{margin-top:7px}.msg{padding:12px;background:#fff8ee;border-radius:10px;margin:10px 0}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1}.stats{font-size:13px;color:#76675e}@media(max-width:600px){.tabs{display:block}}.backMemorias{position:fixed;top:16px;left:16px;z-index:10000;width:44px;height:44px;margin:0;padding:0;border:1px solid var(--o);border-radius:50%;background:#fffaf1;color:var(--v);display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1;box-shadow:0 4px 18px #0002;cursor:pointer}</style></head><body><button class="backMemorias" type="button" onclick="window.location.href='/Julieta-Cadmiel/memorias/#momentos-historia'" title="Voltar às memórias" aria-label="Voltar à página das memórias">←</button><main class="w"><h1>J & C</h1><h2>Painel dos Noivos — Memórias</h2><section id="login" class="card"><h3>Entrada privada</h3><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Palavra-passe"><button onclick="entrar()">Entrar</button><button class="secondary" onclick="criarConta()">Criar acesso dos noivos</button><div id="aviso" class="msg">Acesso reservado aos noivos.</div></section><section id="painel" class="hidden"><section class="card"><h3>📸 Carregar fotografias dos noivos</h3><p>Estas fotografias entram directamente na galeria pública, sem aprovação.</p><input id="fotosNoivos" type="file" accept="image/*" multiple><textarea id="legendaNoivos" rows="2" placeholder="Legenda ou mensagem (opcional)"></textarea><button id="btnNoivos" class="ok" onclick="enviarNoivos()">Publicar fotografias</button><div id="progressoLote" style="display:none;margin-top:12px"><div style="height:10px;background:#eadfc9;border-radius:999px;overflow:hidden"><div id="barraLote" style="height:100%;width:0;background:#073f2c;transition:width .2s"></div></div><div id="textoLote" class="msg" style="margin-top:7px"></div></div><div id="estadoUpload" class="msg">Pode seleccionar várias fotografias, incluindo lotes grandes.</div></section><div class="tabs"><button onclick="listar('pendente')">Pendentes</button><button class="ok" onclick="listar('aprovado')">Aprovadas</button><button onclick="listarComentarios()">Comentários</button><button class="secondary" onclick="sair()">Sair</button></div><div id="estado" class="msg"></div><div id="fotos" class="grid"></div><section id="comentariosAdmin" class="card hidden"><h3>💬 Gestão de comentários</h3><div id="listaComentarios"></div></section></section></main><script>
var U="https://dzvscfeypjoytajqxczs.supabase.co",K="sb_publishable_Gxfls-Yl2krdF-4Xzbc_4A_XvRv0iNK",B="memorias-casamento",token="",refreshToken="";function av(t){document.getElementById("aviso").textContent=t}function guardarSessao(d){token=d.access_token||"";refreshToken=d.refresh_token||"";if(token)localStorage.setItem("jc_admin_session",JSON.stringify({access_token:token,refresh_token:refreshToken}))}function limparSessao(){token="";refreshToken="";localStorage.removeItem("jc_admin_session")}async function autorizarPainel(){if(!token)return false;try{var q=await fetch(U+"/rest/v1/memorias_admins?select=user_id",{headers:{apikey:K,Authorization:"Bearer "+token}});if(q.status===401)return false;var a=await q.json();if(!a.length)return false;document.getElementById("login").classList.add("hidden");document.getElementById("painel").classList.remove("hidden");listar("pendente");return true}catch(e){return false}}async function restaurarSessao(){var raw=localStorage.getItem("jc_admin_session");if(!raw)return;try{var s=JSON.parse(raw);token=s.access_token||"";refreshToken=s.refresh_token||"";if(await autorizarPainel())return;if(refreshToken){var r=await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:refreshToken})}),d=await r.json();if(r.ok){guardarSessao(d);if(await autorizarPainel())return}}}catch(e){}limparSessao();av("A sua sessão terminou. Entre novamente.")}
async function criarConta(){var e=document.getElementById("email").value.trim(),p=document.getElementById("senha").value;if(!e||p.length<6){av("Indique um e-mail válido e uma palavra-passe com pelo menos 6 caracteres.");return}var r=await fetch(U+"/auth/v1/signup?redirect_to="+encodeURIComponent(location.href),{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});var d=await r.json();av(r.ok?"Conta criada. Confirme o e-mail e depois entre.":"Não foi possível criar a conta: "+(d.error_description||d.msg||d.message||d.error_code||"verifique os dados."))}
async function entrar(){var e=document.getElementById("email").value.trim(),p=document.getElementById("senha").value,r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})}),d=await r.json();if(!r.ok){av("Não foi possível entrar. Verifique o e-mail, a palavra-passe e a confirmação do e-mail.");return}guardarSessao(d);if(!(await autorizarPainel())){av("Conta criada, mas ainda aguarda autorização como administrador.");limparSessao();return}}
async function uploadFotoNoivos(f,i,m,total){var ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase(),p="noivos/"+Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2)+"."+ext;for(var tentativa=1;tentativa<=3;tentativa++){try{var up=await fetch(U+"/storage/v1/object/"+B+"/"+p,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+token,"Content-Type":f.type,"x-upsert":"false"},body:f});if(!up.ok)throw new Error("storage "+up.status);var db=await fetch(U+"/rest/v1/memorias_uploads",{method:"POST",headers:{apikey:K,Authorization:"Bearer "+token,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({nome_convidado:"Julieta & Cadmiel",mensagem:m||null,caminho:p,nome_original:f.name,status:"aprovado"})});if(!db.ok)throw new Error("db "+db.status);return {ok:true,nome:f.name}}catch(e){if(tentativa===3)return {ok:false,nome:f.name,erro:e.message};await new Promise(function(r){setTimeout(r,1200*tentativa)})}}}
async function enviarNoivos(){var files=Array.from(document.getElementById("fotosNoivos").files).filter(function(f){return f.type.startsWith("image/")}),m=document.getElementById("legendaNoivos").value.trim(),b=document.getElementById("btnNoivos"),s=document.getElementById("estadoUpload"),pg=document.getElementById("progressoLote"),bar=document.getElementById("barraLote"),txt=document.getElementById("textoLote");if(!files.length){s.textContent="Escolha pelo menos uma fotografia.";return}b.disabled=true;pg.style.display="block";bar.style.width="0%";var total=files.length,feito=0,sucesso=0,falhas=[];function progresso(){var pct=Math.round(feito/total*100);bar.style.width=pct+"%";txt.textContent=feito+" / "+total+" processadas • "+sucesso+" publicadas"+(falhas.length?" • "+falhas.length+" falharam":"");s.textContent="Envio em curso. Não feche esta página até terminar."}progresso();var proximo=0,concorrencia=Math.min(4,total);async function worker(){while(true){var i=proximo++;if(i>=total)return;var r=await uploadFotoNoivos(files[i],i,m,total);feito++;if(r.ok)sucesso++;else falhas.push(r.nome);progresso()}}await Promise.all(Array.from({length:concorrencia},worker));b.disabled=false;if(falhas.length){s.textContent=sucesso+" fotografias publicadas. "+falhas.length+" não foram enviadas após 3 tentativas. Seleccione novamente apenas as que falharam: "+falhas.slice(0,8).join(", ")+(falhas.length>8?"…":"")}else{s.textContent=sucesso+" fotografias publicadas com sucesso directamente nas Memórias.";document.getElementById("fotosNoivos").value="";document.getElementById("legendaNoivos").value=""}listar("aprovado")}
async function listar(s){document.getElementById("comentariosAdmin").classList.add("hidden");document.getElementById("estado").textContent="A carregar fotografias "+s+"s...";var r=await fetch(U+"/rest/v1/memorias_uploads?select=id,nome_convidado,mensagem,caminho,nome_original,status,created_at,visualizacoes,descargas&status=eq."+s+"&order=created_at.desc",{headers:{apikey:K,Authorization:"Bearer "+token}}),d=await r.json(),g=document.getElementById("fotos");g.innerHTML="";document.getElementById("estado").textContent=d.length?d.length+" fotografia(s).":"Nenhuma fotografia nesta categoria.";d.forEach(function(x){var u=U+"/storage/v1/object/public/"+B+"/"+x.caminho,c=document.createElement("article");c.className="item";c.innerHTML='<img src="'+u+'"><div class="pad"><strong>'+(x.nome_convidado||"Convidado")+'</strong><p>'+(x.mensagem||"Sem mensagem")+'</p><p class="stats">👁 '+(x.visualizacoes||0)+' visualizações • ⬇ '+(x.descargas||0)+' descargas</p><a href="'+u+'" target="_blank">Abrir fotografia</a>'+(s==="pendente"?'<button class="ok" onclick="mudar('+x.id+',\'aprovado\')">Aprovar</button>':'')+'<button class="danger" onclick="eliminar('+x.id+',\''+x.caminho.replace(/'/g,"")+'\',\''+s+'\')">Eliminar</button></div>';g.appendChild(c)})}
async function listarComentarios(){var box=document.getElementById("comentariosAdmin"),g=document.getElementById("fotos"),e=document.getElementById("listaComentarios");g.innerHTML="";box.classList.remove("hidden");document.getElementById("estado").textContent="A carregar comentários...";var r=await fetch(U+"/rest/v1/memorias_comentarios?select=id,memoria_id,nome,comentario,status,created_at,editado_em&order=created_at.desc",{headers:{apikey:K,Authorization:"Bearer "+token}}),d=await r.json();document.getElementById("estado").textContent=d.length?d.length+" comentário(s).":"Nenhum comentário.";e.innerHTML="";d.forEach(function(x){var p=document.createElement("div");p.className="item";p.style.marginBottom="12px";p.innerHTML='<div class="pad"><strong>'+escAdmin(x.nome)+'</strong> <span class="stats">• '+(x.status==="pendente"?"Aguarda aprovação":"Publicado")+'</span><p>'+escAdmin(x.comentario)+'</p><p class="stats">Fotografia #'+x.memoria_id+' • '+new Date(x.created_at).toLocaleString("pt-PT")+(x.editado_em?" • editado":"")+'</p>'+(x.status==="pendente"?'<button class="ok" onclick="aprovarComentario('+x.id+')">Aprovar</button>':'')+'<button class="secondary" onclick="editarComentario('+x.id+','+JSON.stringify(x.comentario).replace(/"/g,"&quot;")+')">Editar</button><button class="danger" onclick="apagarComentario('+x.id+')">Apagar</button></div>';e.appendChild(p)})}
function escAdmin(s){return String(s||"").replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]})}
async function aprovarComentario(id){await fetch(U+"/rest/v1/memorias_comentarios?id=eq."+id,{method:"PATCH",headers:{apikey:K,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({status:"aprovado"})});listarComentarios()}
async function editarComentario(id,actualTxt){var t=prompt("Editar comentário:",actualTxt);if(t===null)return;t=t.trim();if(!t)return;await fetch(U+"/rest/v1/memorias_comentarios?id=eq."+id,{method:"PATCH",headers:{apikey:K,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({comentario:t,editado_em:new Date().toISOString(),status:"aprovado"})});listarComentarios()}
async function apagarComentario(id){if(!confirm("Apagar definitivamente este comentário?"))return;await fetch(U+"/rest/v1/memorias_comentarios?id=eq."+id,{method:"DELETE",headers:{apikey:K,Authorization:"Bearer "+token}});listarComentarios()}
async function mudar(id,s){await fetch(U+"/rest/v1/memorias_uploads?id=eq."+id,{method:"PATCH",headers:{apikey:K,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({status:s})});listar("pendente")}
async function eliminar(id,path,s){if(!confirm("Eliminar definitivamente esta fotografia?"))return;await fetch(U+"/storage/v1/object/"+B+"/"+path,{method:"DELETE",headers:{apikey:K,Authorization:"Bearer "+token}});await fetch(U+"/rest/v1/memorias_uploads?id=eq."+id,{method:"DELETE",headers:{apikey:K,Authorization:"Bearer "+token}});listar(s)}
function sair(){limparSessao();document.getElementById("painel").classList.add("hidden");document.getElementById("login").classList.remove("hidden");av("Sessão terminada.")}restaurarSessao();</script></body></html>
